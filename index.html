<!DOCTYPE html>
<html>
    <head>
        <title>StreetOS</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="tela-carregamento">
            <div class="container-bolinhas">
                <div class="bolinha bolinha1"></div>
                <div class="bolinha bolinha2"></div>
                <div class="bolinha bolinha3"></div>
            </div>
        </div>

        <div class="top-bar">
            <span>StreetOS</span>
            <span id="relogio">00:00:00</span>
        </div>

        <div class="icone" id="btn-calc">
            <img src="imagens/calculadora.png" width="64" height="64">
            <br>Calculator
        </div>

        <div class="icone" id="btn-clima">
            <img src="imagens/clima.jpg" width="64" height="64">
            <br>Weather
        </div>

        <div class="icone" id="btn-notas">
            <img src="imagens/notas.jpg" width="64" height="64">
            <br> Notes
        </div>

        <div class="icone" id="btn-bemvindo">
            <img src="imagens/bemvindo.png" width="64" height="64">
            <br>Message
        </div>

        <div class="icone" id="btn-pesquisar">
            <img src="imagens/pesquisar.png" width="64" height="64">
            <br>Search
        </div>

        <div class="icone" id="btn-musica">
            <img src="imagens/musica.jpg" width="64" height="64">
            <br>Music
        </div>

        <div id="janela-calc" class="janela calc-card">
            <div class="janela-cabeca">
                <span>Calculator</span>
                <button class="btn-fechar" id="fechar-calc"> </button>
            </div>
            <div class="janela-conteudo">
                <input type="text" id="calc-screen" readonly value="0" />
                    <div class="calc-buttons">
                    <button class="btn-clear" onclick="limpar()">C</button>
                    <button class="btn-back" onclick="apagarUltimo()">⌫</button>
                    <button class="btn-op" onclick="addValor('/100')">%</button>
                    <button class="btn-op" onclick="addValor('/')">/</button>
                    <button class="btn-num" onclick="addValor('7')">7</button>
                    <button class="btn-num" onclick="addValor('8')">8</button>
                    <button class="btn-num" onclick="addValor('9')">9</button>
                    <button class="btn-op" onclick="addValor('*')">x</button>
                    <button class="btn-num" onclick="addValor('4')">4</button>
                    <button class="btn-num" onclick="addValor('5')">5</button>
                    <button class="btn-num" onclick="addValor('6')">6</button>
                    <button class="btn-op" onclick="addValor('-')">-</button>
                    <button class="btn-num" onclick="addValor('1')">1</button>
                    <button class="btn-num" onclick="addValor('2')">2</button>
                    <button class="btn-num" onclick="addValor('3')">3</button>
                    <button class="btn-op" onclick="addValor('+')">+</button>
                    <button class="btn-num">GMM</button>
                    <button class="btn-num" onclick="addValor('0')">0</button>
                    <button class="btn-num" onclick="addValor('.')">.</button>
                    <button id="btn-equal" onclick="calcular()">=</button>
                </div>
            </div>
        </div>

        <div class="janela" id="janela-clima">
            <div class="janela-cabeca">
                <span>Weather</span>
                <button class="btn-fechar" id="fechar-clima"> </button>
            </div>
            <div class="janela-conteudo">
                <h3 id="cidade">Loading...</h3>
                <p id="temp-clima">-- °C</p>
            </div>
        </div>

        <div class="janela" id="janela-notas">
            <div class="janela-cabeca">
                <span>Notes</span>
                <button class="btn-fechar" id="fechar-notas"> </button>
            </div>
            <div class="janela-conteudo">
                <textarea id="texto-notas" placeholder="Write here..."></textarea>
            </div>
        </div>

        <div class="janela" id="janela-bemvindo">
            <div class="janela-cabeca">
                <span>Welcome</span>
                <button class="btn-fechar" id="fechar-bemvindo"> </button>
            </div>
            <div class="janela-conteudo">
                <p>This OS was made for stardance hack club. I made this by combining 
                    two themes I like: street aesthetic and Japan.
                </p>
            </div>
        </div>

        <div class="janela" id="janela-pesquisa">
            <div class="janela-cabeca">
                <span>Type your search</span>
                <button class="btn-fechar" id="fechar-pesquisa"> </button>
            </div>
            <div class="janela-conteudo">
                <input type="text" id="campo-pesquisa" placeholder="Search here">
                <button id="btn-fazer-pesquisa">Search</button>
            </div>
        </div>

        <div class="janela" id="janela-musica">
            <div class="janela-cabeca">
               <span>Music Player</span>
                <button class="btn-fechar" id="fechar-musica"> </button>
            </div>
            <div class="janela-conteudo">
                <iframe 
                    id="player-musica"
                    src="https://open.spotify.com/embed/playlist/1xy0tJzbll2FdnEadNyZq4?utm_source=generator&theme=0" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                > 
                </iframe>
            </div>
        </div>

        <script src="script.js"></script>

    </body>
</html>
