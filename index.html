<!DOCTYPE html>
<html>
    <head>
        <title>BeachOS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="top-bar">
            <span>BeachOS</span>
            <span id="relogio">00:00:00</span>
        </div>

        <div class="icone" id="btn-calc">
            <img src="imagens/calculadora.png" width="64" height="64">
            <br>Calculator
        </div>

        <div class="icone" id="btn-clima">
            <img src="imagens/clima.png" width="64" height="64">
            <br>Weather
        </div>

        <div class="icone" id="btn-notas">
            <img src="imagens/notas.png" width="64" height="64">
            <br> Notes
        </div>

        <div class="icone" id="btn-bemvindo">
            <img src="imagens/bemvindo.png" width="64" height="64">
            <br>Welcome
        </div>

        <div class="janela" id="janela-calc">
            <div class="janela-cabeca">
                <span>Calculator</span>
                <button class="btn-fechar" id="fechar-calc">x</button>
            </div>
            <div class="janela-conteudo">
                <p>Calculator app</p>
            </div>
        </div>

        <div class="janela" id="janela-clima">
            <div class="janela-cabeca">
                <span>Weather</span>
                <button class="btn-fechar" id="fechar-clima">x</button>
            </div>
            <div class="janela-conteudo">
                <p>Weather app</p>
            </div>
        </div>

        <div class="janela" id="janela-notas">
            <div class="janela-cabeca">
                <span>Notes</span>
                <button class="btn-fechar" id="fechar-notas">x</button>
            </div>
            <div class="janela-conteudo">
                <p>Notes app</p>
            </div>
        </div>

        <div class="janela" id="janela-bemvindo">
            <div class="janela-cabeca">
                <span>Welcome</span>
                <button class="btn-fechar" id="fechar-bemvindo">x</button>
            </div>
            <div class="janela-conteudo">
                <p>This OS is inspired in my natural habitat</p>
            </div>
        </div>

        <script src="script.js"></script>

    </body>
</html>
